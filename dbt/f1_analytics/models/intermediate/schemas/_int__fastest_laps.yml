version: 2

models:
  - name: int__fastest_laps
    description: |
      This model identifies the fastest lap in each race session.
    columns:
      - name: session_id
        description: The unique identifier for the session.
        data_tests:
          - not_null
      - name: fastest_lap_time
        description: The time of the fastest lap in seconds.
        data_tests:
          - not_null
      - name: driver_number
        description: The number of the driver.
        data_tests:
          - not_null
      - name: lap_number
        description: The lap number of the fastest lap.
        data_tests:
          - not_null
